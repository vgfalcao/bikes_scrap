# .github/workflows/bike-monitor.yml
# Coloque este arquivo em: .github/workflows/bike-monitor.yml
# (na raiz do seu repositório GitHub)

name: Bike Monitor

on:
  # Roda 2x por semana:
  # Terça às 10h BRT (13h UTC) e Sexta às 10h BRT (13h UTC)
  # Lógica: terça captura anúncios do fim de semana/segunda.
  #         sexta captura o meio da semana antes do fim de semana,
  #         quando vendedores costumam postar mais.
  schedule:
    - cron: "0 13 * * 2"   # terça-feira 10h BRT
    - cron: "0 13 * * 5"   # sexta-feira 10h BRT

  # Permite rodar manualmente pelo GitHub UI (Actions > Bike Monitor > Run workflow)
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Reavaliar tudo (ignora seen_ids) e enviar e-mail mesmo sem novidades"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      diag:
        description: "Logs de diagnóstico detalhados"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Necessário para commitar benchmarks.json e bench_history.json de volta.
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Checkout do repositório
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # 2. Restaura o cache de seen_ids.json (IDs já notificados)
      #    Sem isso, a cada run o arquivo seria resetado e você receberia
      #    os mesmos anúncios de novo.
      - name: Restore seen IDs cache
        uses: actions/cache@v4.2.3
        with:
          path: seen_ids.json
          key: seen-ids-${{ runner.os }}
          restore-keys: |
            seen-ids-

      # 3. Python setup
      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      # 4. Instala dependências
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      # 5. Roda o monitor
      - name: Run bike monitor
        env:
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS:        ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          PRECO_MAX:         ${{ secrets.PRECO_MAX }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # DIAG deixou de ser secret: o valor "1" fazia o GitHub mascarar TODO
          # digito 1 nos logs ("score= 4***", "grupo=***05"), deixando o proprio
          # diagnostico ilegivel. Em runs agendadas inputs.diag vem vazio -> "1".
          DIAG:              ${{ inputs.diag || '1' }}
          FORCE_NOTIFY:      ${{ inputs.force_notify }}
        run: |
          python scraper.py

      # 5b. Commita a calibração dos benchmarks de volta no repo.
      #     Cache não serve aqui: se for despejado, perde-se todo o histórico
      #     acumulado e os benchmarks voltam a congelar. No repo fica durável
      #     e auditável (dá para ver a mediana andando commit a commit).
      - name: Commit benchmarks calibrados
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain benchmarks.json bench_history.json)" ]; then
            echo "Nenhuma mudança na calibração — nada a commitar"
            exit 0
          fi
          git config user.name  "bike-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks.json bench_history.json
          git commit -m "chore(benchmarks): calibração automática $(date -u +%Y-%m-%d)"
          # Rebase antes do push: runs concorrentes ou commits manuais no meio.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push falhou (tentativa $i), refazendo rebase..."
            sleep $((i * 5))
          done
          echo "::warning::Não foi possível commitar a calibração dos benchmarks"

      # 6. Salva o seen_ids.json atualizado de volta no cache
      - name: Save seen IDs cache
        uses: actions/cache@v4.2.3
        if: always()
        with:
          path: seen_ids.json
          key: seen-ids-${{ runner.os }}-${{ github.run_id }}

      # 7. Upload do seen_ids como artefato (debug/backup)
      - name: Upload seen IDs artifact
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: seen-ids-${{ github.run_number }}
          path: seen_ids.json
          retention-days: 7
